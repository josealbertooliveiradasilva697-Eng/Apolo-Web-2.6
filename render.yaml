# Nenhuma credencial real aqui. Configurar os dois valores no painel Render.
services:
  - type: web
    name: apolo-web
    runtime: python
    plan: free
    branch: feature/render-deploy
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m tools.iniciar_online
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APOLO_ENV
        value: production
      - key: APOLO_AUTH_MODE
        value: supabase
      - key: APOLO_REPOSITORY_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
